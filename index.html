<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog & Kalkulator Kusen Aluminium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon WhatsApp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-20">

    <!-- Container Utama -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">Workshop Aluminium & Kusen</h1>
            <p class="text-slate-400">Katalog produk dan kalkulator estimasi harga otomatis</p>
        </header>

        <!-- Galeri Foto (Grid 3 Kolom) -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg mb-8">
            <!-- Gambar Besar / Preview -->
            <div class="mb-4">
                <img id="mainImg" src="jendela1.jpg" alt="Preview Jendela"
                    class="w-full h-64 md:h-80 object-cover rounded-lg cursor-pointer shadow-md"
                    onclick="openModal(this.src)">
            </div>

            <!-- Daftar Thumbnail Foto (3 Kolom ke Bawah, Total 7 Foto) -->
            <div class="grid grid-cols-3 gap-3">
                <img src="jendela1.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(0)">
                <img src="jendela2.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(1)">
                <img src="jendela3.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(2)">
                <img src="jendela4.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(3)">
                <img src="jendela5.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(4)">
                <img src="jendela6.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(5)">
                <img src="jendela7.jpg"
                    class="thumb-img w-full h-24 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-blue-500 hover:opacity-80 transition-all"
                    onclick="setSlide(6)">
            </div>
        </div>

        <!-- Kalkulator Estimasi Harga -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Kalkulator Estimasi Harga</h2>

            <form onsubmit="calculate(event); return false;" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Pilih Jenis / Kategori:</label>
                    <select id="tipeAluminium"
                        class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                        <option value="1">3 Inch (Rp 225.000 / meter)</option>
                        <option value="2">4 Inch Standar (Rp 275.000 / meter)</option>
                        <option value="3">Bending All-in (Rp 275.000 / meter)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Panjang / Volume (meter):</label>
                    <input type="number" id="volume" step="0.1" placeholder="Contoh: 2.5"
                        class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500"
                        required>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Hitung Estimasi & Pesan
                </button>
            </form>

            <div id="hasilKalkulator" class="mt-6 p-4 bg-slate-700 rounded-lg hidden">
                <p id="teksHasil" class="mb-3 text-lg font-medium"></p>
                <a id="btnWa" href="#" target="_blank"
                    class="inline-block bg-green-600 hover:bg-green-500 text-white font-medium px-4 py-2 rounded-lg transition-colors">
                    <i class="fab fa-whatsapp mr-2"></i> Kirim Pesanan via WhatsApp
                </a>
            </div>
        </div>
    </div>

    <!-- TOMBOL WHATSAPP MENGAMBANG (FLOATING BUTTON) -->
    <a id="floatingWa" href="#" target="_blank"
        class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl text-3xl z-50 transition-transform hover:scale-110"
        title="Konsultasi via WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Modal Gambar Fullscreen -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4"
        onclick="closeModal()">
        <div class="relative max-w-4xl w-full">
            <img id="modalImg" src="" class="w-full max-h-[85vh] object-contain rounded-lg">
        </div>
    </div>

    <!-- JavaScript Logika & Kalkulator -->
    <script>
        const phone = "6281314362685";

        document.addEventListener("DOMContentLoaded", function () {
            const floatingWa = document.getElementById("floatingWa");
            const pesanKonsul = "Halo, saya ingin berkonsultasi mengenai pemesanan kusen aluminium.";
            floatingWa.href = `https://wa.me/${phone}?text=${encodeURIComponent(pesanKonsul)}`;
        });

        const photos = [
            "jendela1.jpg",
            "jendela2.jpg",
            "jendela3.jpg",
            "jendela4.jpg",
            "jendela5.jpg",
            "jendela6.jpg",
            "jendela7.jpg"
        ];

        let currentSlide = 0;

        function setSlide(index) {
            currentSlide = index;
            const mainImg = document.getElementById("mainImg");
            const thumbs = document.querySelectorAll(".thumb-img");

            mainImg.src = photos[currentSlide];

            thumbs.forEach((t, i) => {
                if (i === currentSlide) {
                    t.classList.add("border-blue-500");
                    t.classList.remove("border-transparent");
                } else {
                    t.classList.remove("border-blue-500");
                    t.classList.add("border-transparent");
                }
            });
        }

        function openModal(src) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");
            modalImg.src = src;
            modal.classList.remove("hidden");
        }

        function closeModal() {
            const modal = document.getElementById("imageModal");
            modal.classList.add("hidden");
        }

        function calculate(event) {
            if (event) event.preventDefault();

            const tipe = document.getElementById("tipeAluminium").value;
            const volume = parseFloat(document.getElementById("volume").value) || 0;

            let hargaPerMeter = 225000;
            let namaTipe = "3 Inch";

            if (tipe === "2") {
                hargaPerMeter = 275000;
                namaTipe = "4 Inch Standar";
            } else if (tipe === "3") {
                hargaPerMeter = 275000;
                namaTipe = "Bending All-in";
            }

            const totalHarga = hargaPerMeter * volume;
            const formatRupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalHarga);

            const hasilDiv = document.getElementById("hasilKalkulator");
            const teksHasil = document.getElementById("teksHasil");
            const btnWa = document.getElementById("btnWa");

            teksHasil.innerHTML = `Estimasi Kusen <b>${namaTipe}</b> (${volume} m): <b class="text-green-400">${formatRupiah}</b>`;

            const pesan = `Halo, saya mau pesan kusen aluminium tipe ${namaTipe} dengan ukuran ${volume} meter. Total estimasi harga: ${formatRupiah}. Mohon infonya lebih lanjut.`;
            btnWa.href = `https://wa.me/${phone}?text=${encodeURIComponent(pesan)}`;

            hasilDiv.classList.remove("hidden");
        }
    </script>
</body>

</html>
